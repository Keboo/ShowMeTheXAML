<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded rectangle background -->
  <rect width="128" height="128" rx="20" fill="url(#bgGradient)"/>
  
  <!-- Large angle brackets representing XML/XAML -->
  <!-- Left bracket < -->
  <path d="M 45 32 L 28 64 L 45 96" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Right bracket > -->
  <path d="M 83 32 L 100 64 L 83 96" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Eye icon in the center representing "show/view" -->
  <ellipse cx="64" cy="64" rx="24" ry="16" fill="white" opacity="0.9"/>
  <circle cx="64" cy="64" r="10" fill="#1E40AF"/>
  <circle cx="66" cy="62" r="4" fill="white"/>
</svg>
