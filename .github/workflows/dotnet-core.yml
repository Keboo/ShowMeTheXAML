name: .NET Core

on:
  push:
    branches: [ master ]
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
    paths-ignore:
    - 'README.md'
    - 'Examples/**'
  pull_request:
    branches: [ master ]

defaults:
  run:
    shell: pwsh

env:
  project: ShowMeTheXAML
  configuration: Release
  baseVersion: 2.1.0

jobs:
  build-main:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5
    
    - name: Set Version
      run: |
        if ("${{ github.ref }}".startsWith("refs/tags/v")) {
          $tagVersion = "${{ github.ref }}".substring(11)
          "buildVersion=$tagVersion.${{ github.run_number }}" >> $env:GITHUB_ENV
          "nugetVersion=$tagVersion" >> $env:GITHUB_ENV
        } else {
          "buildVersion=${{ env.baseVersion }}.${{ github.run_number }}" >> $env:GITHUB_ENV
          "nugetVersion=${{ env.baseVersion }}-ci${{ github.run_number }}" >> $env:GITHUB_ENV
        }
    
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
        source-url: https://nuget.pkg.github.com/keboo/index.json
      env:
        NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
    
    - name: Install dependencies
      run: dotnet restore ShowMeTheXAML.slnx

    - name: Build
      run: dotnet build ShowMeTheXAML.slnx -p:Version=${{ env.buildVersion }} -p:PackageVersion=${{ env.nugetVersion }} --configuration ${{ env.configuration }}
    
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration ${{ env.configuration }} --logger "console" ShowMeTheXAML.slnx

    - name: Pack
      run: dotnet pack ShowMeTheXAML.slnx -p:Version=${{ env.buildVersion }} -p:PackageVersion=${{ env.nugetVersion }} --configuration ${{ env.configuration }} --no-build

    - name: Upload Artifacts
      uses: actions/upload-artifact@v5
      with:
        name: NuGet
        path: ${{ github.workspace }}\**\*.nupkg

    - name: Push NuGet
      if: ${{ github.event_name != 'pull_request' }}
      run: dotnet nuget push ${{ github.workspace }}\${{ env.project }}*\bin\${{ env.configuration }}\${{ env.project }}*.${{ env.nugetVersion }}.nupkg --source https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }} --skip-duplicate

  automerge:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: fastify/github-action-merge-dependabot@v3.11.2